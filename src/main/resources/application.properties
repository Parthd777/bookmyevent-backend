server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:postgresql://localhost:5432/bookmyevent
spring.datasource.username=postgres
spring.datasource.password=Parth

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Base64-encoded HMAC-SHA key (min 32 bytes). Override with JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktYm9va215ZXZlbnQtand0LXNlY3JldC1rZXktMzJi}
app.jwt.expiration-ms=3600000

# Comma-separated browser origins. Empty means no cross-origin access.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Reject unknown JSON fields so clients cannot smuggle extra properties into DTOs.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Cap request sizes to limit memory-exhaustion attempts.
server.tomcat.max-http-form-post-size=128KB
server.tomcat.max-swallow-size=128KB
server.max-http-request-header-size=16KB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
