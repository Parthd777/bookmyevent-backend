# ─────────────────────────────────────────────────────────
# BookMyEvent — Day 4 (Spring Boot REST)
# ─────────────────────────────────────────────────────────
server.port=8080

# ── File storage ─────────────────────────────────────────
app.storage.folder=data

# ── AES-256-GCM encryption key for persisted data files ──
#
# Format : Base64-encoded 32-byte (256-bit) key
# Algorithm: AES/GCM/NoPadding — authenticated encryption
#            (protects both confidentiality and integrity)
#
# ⚠  IMPORTANT: The value below is for local development ONLY.
#    In production, supply this via an environment variable so
#    it is never committed to source control:
#      export APP_STORAGE_ENCRYPTION_KEY=<your-generated-key>
#    or use a secrets manager (Vault, AWS Secrets Manager, etc.)
#
# Generate a fresh key:
#   openssl rand -base64 32
app.storage.encryption-key=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY=

# ── Suppress Spring's default /error endpoint detail ─────
# We return structured errors ourselves via GlobalExceptionHandler
server.error.include-message=never
server.error.include-stacktrace=never
